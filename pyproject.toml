[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotate"
dynamic = ["version", "dependencies"]
description = "Multi-agent clinical conversation annotation pipeline"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["annotation", "clinical-nlp", "langgraph", "ollama", "tobacco-cessation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
annotate-single = "annotate.examples.run_single_conversation:main"
annotate-batch = "annotate.examples.run_batch_pipeline:main"
annotate-generate = "annotate.examples.generate_dataset:main"

[tool.setuptools]
include-package-data = true
packages = [
    "annotate",
    "annotate.agents",
    "annotate.agents.confidence",
    "annotate.agents.consensus",
    "annotate.agents.debate",
    "annotate.agents.extractors",
    "annotate.agents.judge",
    "annotate.agents.longitudinal",
    "annotate.agents.manager",
    "annotate.agents.memory",
    "annotate.agents.reasoning",
    "annotate.agents.review",
    "annotate.agents.revision",
    "annotate.config",
    "annotate.data",
    "annotate.data.raw",
    "annotate.data.sessions",
    "annotate.eval",
    "annotate.examples",
    "annotate.graph",
    "annotate.llm",
    "annotate.prompts",
    "annotate.schemas",
    "annotate.utils",
]

[tool.setuptools.package-dir]
annotate = "."

[tool.setuptools.package-data]
annotate = [
    "prompts/*.json",
    "prompts/*.txt",
    "data/raw/*.json",
    "data/raw/*.txt",
    "data/sessions/*.json",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]
annotate = ["setup.py"]

[tool.setuptools.dynamic]
version = {attr = "annotate.__version__"}
dependencies = {file = ["requirements.txt"]}
